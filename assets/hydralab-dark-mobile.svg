<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="title desc"><title id="title">HydraLab evidence trail</title><desc id="desc">Source documents connect to citations, agent workflows and human review.</desc><style>.bg{fill:#111E33;}.ink{fill:#EAF1FF;}.muted{fill:#A5B8D5;}.line{stroke:#314564;fill:none;}.panel{fill:#192B46;}.blue{fill:#9AABFF;}.teal{fill:#6BD9C9;}.amber{fill:#F1C17D;}.wash{fill:#233559;} .line{stroke:#314564}path.muted{stroke:#A5B8D5;fill:none}.muted-stroke{stroke:#A5B8D5;fill:none}.blue-stroke{stroke:#9AABFF;fill:none}.teal-stroke{stroke:#6BD9C9;fill:none}.panel{stroke:#314564} text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif} .signal{stroke:#9AABFF;fill:none;stroke-dasharray:7 35;stroke-width:3;opacity:.65} .soft{opacity:.65}</style><rect width="600" height="330" rx="20" class="bg"/><text x="30" y="54" class="ink" font-size="32" font-weight="650" >A visible evidence trail</text><rect x="30" y="90" width="240" height="68" rx="12" class="panel"/><text x="150" y="133" class="ink" font-size="28" font-weight="550" text-anchor="middle">Sources</text><rect x="330" y="90" width="240" height="68" rx="12" class="panel"/><text x="450" y="133" class="ink" font-size="28" font-weight="550" text-anchor="middle">Citations</text><rect x="30" y="215" width="240" height="68" rx="12" class="panel"/><text x="150" y="258" class="ink" font-size="28" font-weight="550" text-anchor="middle">Review</text><rect x="330" y="215" width="240" height="68" rx="12" class="panel"/><text x="450" y="258" class="ink" font-size="28" font-weight="550" text-anchor="middle">Agents</text><path d="M270 124H330M450 158V215M330 249H270" fill="none" class="blue-stroke" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="30" y="307" class="muted" font-size="22" font-weight="400" >Documents, citations, agents and human review.</text></svg>
