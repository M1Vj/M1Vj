<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="title desc"><title id="title">HydraLab evidence trail</title><desc id="desc">Source documents connect to citations, agent workflows and human review.</desc><style>.bg{fill:#F4F7FC;}.ink{fill:#16243D;}.muted{fill:#516582;}.line{stroke:#D4DFF0;fill:none;}.panel{fill:#FFFFFF;}.blue{fill:#5369E8;}.teal{fill:#168B83;}.amber{fill:#AB6A17;}.wash{fill:#E6ECFF;} .line{stroke:#D4DFF0}path.muted{stroke:#516582;fill:none}.muted-stroke{stroke:#516582;fill:none}.blue-stroke{stroke:#5369E8;fill:none}.teal-stroke{stroke:#168B83;fill:none}.panel{stroke:#D4DFF0} text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif} .signal{stroke:#5369E8;fill:none;stroke-dasharray:7 35;stroke-width:3;opacity:.65} .soft{opacity:.65}</style><rect width="600" height="330" rx="20" class="bg"/><text x="30" y="54" class="ink" font-size="32" font-weight="650" >A visible evidence trail</text><rect x="30" y="90" width="240" height="68" rx="12" class="panel"/><text x="150" y="133" class="ink" font-size="28" font-weight="550" text-anchor="middle">Sources</text><rect x="330" y="90" width="240" height="68" rx="12" class="panel"/><text x="450" y="133" class="ink" font-size="28" font-weight="550" text-anchor="middle">Citations</text><rect x="30" y="215" width="240" height="68" rx="12" class="panel"/><text x="150" y="258" class="ink" font-size="28" font-weight="550" text-anchor="middle">Review</text><rect x="330" y="215" width="240" height="68" rx="12" class="panel"/><text x="450" y="258" class="ink" font-size="28" font-weight="550" text-anchor="middle">Agents</text><path d="M270 124H330M450 158V215M330 249H270" fill="none" class="blue-stroke" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="30" y="307" class="muted" font-size="22" font-weight="400" >Documents, citations, agents and human review.</text></svg>
